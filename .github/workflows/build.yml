# CI macOS : compile l'app (simulateur iOS) et lance les tests du package à
# chaque PR et sur main. Les échecs de PR remontent automatiquement à la
# session Claude abonnée, qui corrige sans intervention manuelle.
name: Build & Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests unitaires (Packages/Jardin)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Versions des outils
        run: xcodebuild -version && swift --version
      - name: Tests
        run: swift test --package-path Packages/Jardin
      - name: Rapport de crash (diagnostic)
        if: failure()
        run: |
          sleep 10
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || echo "aucun rapport"
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            [ -e "$f" ] || continue
            echo "===== $f ====="
            head -c 24000 "$f"
            echo
          done

  build-ios:
    name: Build app (simulateur iOS)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild build \
            -project JardinIntelligent.xcodeproj \
            -scheme JardinIntelligent \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
